name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      ZIG_VERSION: "0.15.2"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        include:
          - os: ubuntu-latest
            build_flags: "-Dtarget=x86_64-linux"
          - os: ubuntu-24.04-arm
            build_flags: "-Dtarget=aarch64-linux"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libc6-dev clang

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build project
        run: zig build ${{ matrix.build_flags }} -Doptimize=ReleaseSmall

      - name: Run tests
        run: zig build test --summary all

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: on1namer-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ runner.arch }}
          path: |
            zig-out/bin/on1namer*
